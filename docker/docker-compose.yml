version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ixoris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ixoris
      POSTGRES_PASSWORD: ixoris
      POSTGRES_DB: ixoris_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ixoris-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: ixoris-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
